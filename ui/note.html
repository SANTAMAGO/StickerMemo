<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMemo</title>
  <link rel="stylesheet" href="note.css" />
</head>
<body class="note-body">
  <div id="note-root" class="note-root">
    <!-- Paper Card Border -->
    <div id="paper-card" class="paper-card theme-yellow">
      
      <!-- Top Bar (Draggable) -->
      <div id="top-bar" class="top-bar" data-tauri-drag-region>
        <!-- Masking Tape Badge -->
        <div class="tape-badge" data-tauri-drag-region>
          <span id="tape-theme-label" class="tape-label" data-tauri-drag-region>STICKER NOTE</span>
        </div>

        <!-- Right Toolbar Controls -->
        <div class="toolbar">
          <button id="font-btn" class="tool-btn" title="글꼴 및 텍스트 서식 (Font)">🔤</button>
          <button id="color-btn" class="tool-btn" title="테마 색상 변경">🎨</button>
          <button id="archive-btn" class="tool-btn" title="보관함으로 이동 (Archive)">📦</button>
          <button id="delete-btn" class="tool-btn delete" title="메모 영구 삭제">🗑️</button>
          <button id="close-btn" class="tool-btn close" title="닫기 및 Deck으로 복귀 (✕)">✕</button>
        </div>
      </div>

      <!-- Color Palette Popup -->
      <div id="color-popup" class="popup color-popup hidden">
        <div class="color-palette-row">
          <button class="color-dot yellow" data-theme="Yellow" title="Yellow"></button>
          <button class="color-dot pink" data-theme="Pink" title="Pink"></button>
          <button class="color-dot mint" data-theme="Mint" title="Mint"></button>
          <button class="color-dot blue" data-theme="Blue" title="Blue"></button>
          <button class="color-dot purple" data-theme="Purple" title="Purple"></button>
          <button class="color-dot kraft" data-theme="Kraft" title="Kraft"></button>
        </div>
      </div>

      <!-- Font Settings Popup -->
      <div id="font-popup" class="popup font-popup hidden">
        <div class="font-popup-header">
          <span class="font-badge-aa">Aa</span>
          <span class="font-badge-label">서식</span>
        </div>
        
        <!-- Font Family Selector -->
        <div class="font-select-wrapper">
          <select id="font-family-select" class="font-select">
            <option value="Malgun Gothic">Malgun Gothic (맑은 고딕)</option>
            <option value="Pretendard">Pretendard</option>
            <option value="Segoe UI">Segoe UI</option>
            <option value="Gowun Dodum">Gowun Dodum (고운돋움)</option>
            <option value="Consolas">Consolas</option>
            <option value="Gulim">Gulim (굴림)</option>
            <option value="Batang">Batang (바탕)</option>
          </select>
        </div>

        <!-- Font Size Stepper & Bold Chip -->
        <div class="font-control-row">
          <div class="size-stepper">
            <button id="btn-dec-size" class="step-btn" title="글자 크기 축소">−</button>
            <span id="font-size-text" class="size-text">13.5 pt</span>
            <button id="btn-inc-size" class="step-btn" title="글자 크기 확대">+</button>
          </div>

          <div id="bold-chip" class="bold-chip" title="굵게 (Bold)">
            <span class="bold-letter">B</span>
            <span class="bold-text">굵게</span>
          </div>
        </div>
      </div>

      <!-- Title Input -->
      <div class="title-container">
        <input type="text" id="title-input" class="title-input" placeholder="제목 없는 메모" autocomplete="off" />
      </div>

      <!-- Content Editor Textarea -->
      <div class="editor-container">
        <textarea id="content-editor" class="content-editor" placeholder="내용을 입력하세요..."></textarea>
      </div>

      <!-- Footer: Timestamp & Custom Resize Grip -->
      <div class="footer-bar">
        <span id="timestamp-text" class="timestamp-text">방금 수정됨</span>
        <div id="resize-grip" class="resize-grip" title="크기 조절">
          <svg width="12" height="12" viewBox="0 0 12 12">
            <path d="M 11,3 L 11,11 L 3,11 Z" fill="rgba(0,0,0,0.3)"/>
          </svg>
        </div>
      </div>

    </div>
  </div>

  <script src="note.js"></script>
</body>
</html>
