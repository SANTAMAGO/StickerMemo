<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StickerMemo 정보</title><link rel="stylesheet" href="about.css"></head><body><main class="about-card"><div class="about-mark">✦</div><h1>StickerMemo</h1><p class="version">Version 1.0.0</p><p>Rust Edition</p><p>Build: 2026-09-17</p><p>Lightweight Desktop Sticky Notes</p><div class="about-rule"></div><small>Originally built with .NET/WPF<br>Rebuilt with Rust + Tauri</small><button id="close" type="button">닫기</button></main><script>const closeAbout=()=>{const t=window.__TAURI__;const w=t&&t.window;if(w&&w.getCurrentWindow){w.getCurrentWindow().destroy();}};document.getElementById("close").addEventListener("click",closeAbout);window.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeAbout()}});</script></body></html>
